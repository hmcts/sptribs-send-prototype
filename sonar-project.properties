sonar.projectName=sptribs-send-prototype
sonar.projectKey=sptribs-send-prototype
sonar.organization=hmcts
sonar.language=typescript
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# app.ts and server.ts are wiring, and .i18n.ts files are content rather than logic.
sonar.exclusions=src/app.ts,src/server.ts,src/assets/**,src/pages/**/*.i18n.ts

# The page handlers are covered by Playwright, which Sonar cannot see: test:e2e drives the
# whole journey in a browser against a real CCD, and none of that appears in an lcov report.
# Left in sonar.sources so bugs and code smells in them are still analysed — only the
# coverage measurement is excluded, so the figure reflects the code vitest actually covers
# (the appeal library, the CCD and OIDC clients, the middleware) rather than being dragged
# to a quarter of its real value by 50-odd files with no lcov record at all.
sonar.coverage.exclusions=src/pages/**,src/locales/**,src/libs/*/index.ts,src/middleware/redis.ts
# Also excluded from the coverage figure, and why:
#   src/locales/**        content, not logic — the same reason the .i18n.ts files are excluded
#   src/libs/*/index.ts   barrels of re-exports, with nothing to cover
#   src/middleware/redis.ts  wiring: connect a client, mount the session store. Exercised
#                            every time the app boots and by the healthcheck, but there is
#                            nothing to assert without a Redis, and the same reasoning already
#                            excludes app.ts and server.ts.

# One directory per page, each with its own BACK/NEXT, zod schema and render() — the pages
# are deliberately near-identical, which is the point of the convention and is what makes
# them readable one at a time. Duplication detection has nothing useful to say about it.
# sptribs-frontend relaxes CPD for the same reason, by raising its thresholds.
sonar.cpd.exclusions=src/pages/**
