sonar.projectName=sptribs-send-prototype
sonar.projectKey=sptribs-send-prototype
sonar.language=typescript
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# app.ts and server.ts are wiring, and .i18n.ts files are content rather than logic.
sonar.exclusions=src/app.ts,src/server.ts,src/assets/**,src/pages/**/*.i18n.ts
